---
name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (a suffix such as -beta1 makes it a pre-release)
# runs the tests, stamps the version into the integration and creates a GitHub
# release with ica.zip attached, which HACS installs.
# yamllint disable-line rule:truthy
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests must pass before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/ -v

  release:
    name: Build and publish ica.zip
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release and attach the zip
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # needed to check that the tag is on main
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The tag must look like v1.2.3, got: $TAG"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $TAG is not on main. Release from main only."; exit 1
          fi
      - name: Package the integration
        run: ./scripts/package-release.sh "$TAG"
      - name: Create the release and attach ica.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TAG" in *-*) flag="--prerelease" ;; *) flag="" ;; esac
          gh release create "$TAG" dist/ica.zip --title "$TAG" --generate-notes $flag
