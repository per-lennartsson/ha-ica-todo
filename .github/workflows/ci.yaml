---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: yamllint -c .yamllint.yaml .
      - run: pytest tests/ -v

  package:
    name: Release package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/package-release.sh v0.0.0
      - name: Check the zip
        run: |
          unzip -l dist/ica.zip
          unzip -p dist/ica.zip manifest.json | grep '"version": "0.0.0"'
          unzip -l dist/ica.zip | grep -q ' __init__.py$'
          ! unzip -l dist/ica.zip | grep -q __pycache__

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets are not submitted to home-assistant/brands
          ignore: brands
